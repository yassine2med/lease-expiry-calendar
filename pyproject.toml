[project]
name = "lease-expiry-calendar"
version = "0.1.0"
description = "Build a critical-dates list and calendar file from a lease register."
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
